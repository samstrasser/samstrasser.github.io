<html>
    <head>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-color: aquamarine;
            }

            h1 {
                font-size: 10em;
                text-align: center;
                overflow-wrap: break-word;
                max-width: 90vw;
            }
        </style>
    </head>
    <body>
        <h1>Try: ?title=content</h1>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const colorParam = urlParams.get('color');
            
            let backgroundColor;
            
            if (colorParam) {
                backgroundColor = colorParam;
            } else {
                const r = Math.floor(Math.random() * 256);
                const g = Math.floor(Math.random() * 256);
                const b = Math.floor(Math.random() * 256);
                backgroundColor = `rgb(${r}, ${g}, ${b})`;
            }
            
            document.body.style.backgroundColor = backgroundColor;

            // Remember randomly generated colors so Cmd+Z can step back to
            // the previous one after an overzealous refresh.
            const HISTORY_KEY = 'coverColorHistory';
            const HISTORY_LIMIT = 50;

            function loadHistory() {
                try {
                    return JSON.parse(sessionStorage.getItem(HISTORY_KEY)) || [];
                } catch (e) {
                    return [];
                }
            }

            function saveHistory(history) {
                try {
                    sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(-HISTORY_LIMIT)));
                } catch (e) {}
            }

            if (!colorParam) {
                const history = loadHistory();
                history.push(backgroundColor);
                saveHistory(history);
            }

            document.addEventListener('keydown', (event) => {
                if (event.metaKey && !event.shiftKey && event.key.toLowerCase() === 'z') {
                    event.preventDefault();
                    if (colorParam) return;

                    const history = loadHistory();
                    if (history.length < 2) return;
                    history.pop();
                    saveHistory(history);
                    document.body.style.backgroundColor = history[history.length - 1];
                }
            });

            const titleParam = urlParams.get('title');
            if (titleParam) {
                document.querySelector('h1').textContent = titleParam;
                document.title = titleParam + ' - Cover Page';
            }
        </script>
    </body>
</html>
